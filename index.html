<style>
/* Layout: editorial, asymmetric grid on warm ivory. Dusty rose is the ink of authority; category pastels appear as labels and sticker rings, never as page backgrounds. */
:root{
  --bg:#FCFEF1; --primary:#B84C65; --secondary:#5E2A39; --heading:#2B1D21; --text:#3A2C30;
  --btn:#B84C65; --btn-text:#FCFEF1; --accent:#F2C4CE;
  --pantry:#FFBD5A; --culture:#C99AF1; --sip:#78CDFF; --harvest:#C1FF72; --proteins:#FFC3C3;
  --fresh:#3F8F5B; --soon:#E7B227; --warn:#C23B32;
  --ink:#2B1D21; --paper:#FFFDF7; --white:#FFFFFF;
  --surface:color-mix(in srgb,var(--bg) 90%,var(--primary));
  --surface-2:color-mix(in srgb,var(--bg) 95%,var(--heading));
  --line:color-mix(in srgb,var(--text) 16%,transparent);
  --muted:color-mix(in srgb,var(--text) 74%,var(--bg));
  --f-wordmark:'Burgues Script','Pinyon Script',cursive;
  --f-head:'Times New Roman MT Condensed','Instrument Serif','Times New Roman',serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-nav:'Hanken Grotesk',system-ui,sans-serif;
  --f-btn:'Hanken Grotesk',system-ui,sans-serif;
  --f-braille:'Noto Sans Symbols 2','Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif;
  --f-label:'Times New Roman MT Condensed','Instrument Serif','Times New Roman',serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px;
  --r-sm:8px; --r-md:16px; --r-lg:28px; --r-pill:999px;
  --sh-1:0 1px 2px color-mix(in srgb,var(--ink) 10%,transparent),0 10px 24px -14px color-mix(in srgb,var(--ink) 30%,transparent);
  --sh-2:0 2px 4px color-mix(in srgb,var(--ink) 8%,transparent),0 28px 60px -28px color-mix(in srgb,var(--ink) 40%,transparent);
  --ease:cubic-bezier(.2,.7,.2,1); --t:.35s;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-head);color:var(--heading);font-weight:400;line-height:1.02;text-wrap:balance;margin:0}
p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding-left:1.2em}
a{color:var(--primary)}
button{font:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:6px}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.narrow{max-width:820px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:16px;top:-80px;z-index:100;background:var(--btn);color:var(--btn-text);padding:10px 16px;border-radius:var(--r-pill);font-weight:600;text-decoration:none}
.skip:focus{top:calc(12px + env(safe-area-inset-top,0px))}

/* Type helpers */
.eyebrow{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.18em;font-size:.86rem;color:var(--primary)}
.display{font-size:clamp(3rem,8.5vw,7.4rem);line-height:.9;letter-spacing:-.01em}
.h2{font-size:clamp(2.3rem,5.2vw,4.2rem);line-height:.96}
.h3{font-size:clamp(1.55rem,2.4vw,1.95rem)}
.lede{font-size:clamp(1.05rem,1.6vw,1.22rem);max-width:58ch;color:var(--text)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
em.rose{font-style:italic;color:var(--primary)}
.prose{max-width:66ch;display:grid;gap:var(--s4)}

/* Header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:var(--s5);height:72px}
.logo{font-family:var(--f-wordmark);font-size:2.4rem;line-height:1;color:var(--primary);text-decoration:none;padding-top:4px;white-space:nowrap}
.nav{display:flex;gap:2px;align-items:center}
.nav a{font-family:var(--f-nav);font-size:.86rem;font-weight:500;color:var(--text);text-decoration:none;padding:8px 10px;border-radius:var(--r-pill);white-space:nowrap;transition:color var(--t),background var(--t)}
.nav a:hover{color:var(--primary)}
.nav a[aria-current="page"]{color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent)}
.nav a.cta{background:var(--btn);color:var(--btn-text);padding:9px 16px;margin-left:6px}
.menu-btn{display:none;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--line);color:var(--heading);border-radius:var(--r-pill);padding:9px 14px;cursor:pointer;font-family:var(--f-nav);font-weight:600;font-size:.9rem}
.menu-btn svg{width:18px;height:18px}
.mnav{border-top:1px solid var(--line);background:var(--bg)}
.mnav ul{list-style:none;padding:var(--s3) 0 var(--s5);margin:0;display:grid;grid-template-columns:1fr 1fr;gap:2px var(--s4)}
.mnav a{display:block;padding:12px 4px;font-family:var(--f-head);font-size:1.5rem;color:var(--heading);text-decoration:none;border-bottom:1px solid var(--line)}
.mnav a[aria-current="page"]{color:var(--primary)}
@media (max-width:1260px){.nav{display:none}.menu-btn{display:inline-flex}}
@media (max-width:520px){.mnav ul{grid-template-columns:1fr}}

.logo-img{display:inline-flex;flex:none;border-radius:12px;overflow:hidden;box-shadow:var(--sh-1);line-height:0}
.logo-img img{width:56px;height:56px;display:block}
.hero-badge{position:absolute;left:0;top:0;width:31%;border-radius:50%;box-shadow:var(--sh-2);transform:rotate(-6deg);z-index:2}
.f-logo{width:132px;height:132px;border-radius:18px;display:block}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-btn);font-weight:600;font-size:.96rem;line-height:1.2;padding:14px 22px;border-radius:var(--r-pill);border:1.5px solid transparent;cursor:pointer;text-decoration:none;transition:transform var(--t) var(--ease),background var(--t),color var(--t),border-color var(--t),box-shadow var(--t)}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--btn);color:var(--btn-text);box-shadow:var(--sh-1)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.btn-ghost{background:transparent;color:var(--heading);border-color:color-mix(in srgb,var(--heading) 28%,transparent)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:10px 16px;font-size:.88rem}
.btn-link{background:none;border:0;padding:0;color:var(--primary);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:var(--f-btn);text-decoration:none}
.btn-link svg{width:16px;height:16px;transition:transform var(--t) var(--ease)}
.btn-link:hover svg{transform:translateX(4px)}
.actions{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}

/* Sections & dividers */
.section{padding-block:clamp(64px,9vw,128px)}
.section.tight{padding-block:clamp(48px,6vw,80px)}
.section-head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:var(--s5) var(--s7);align-items:end;margin-bottom:clamp(32px,5vw,56px)}
.section-head > div{display:grid;gap:var(--s3)}
@media (max-width:820px){.section-head{grid-template-columns:1fr}}
.divider{display:flex;align-items:center;gap:14px;justify-content:center;padding-block:4px}
.divider::before,.divider::after{content:"";height:1px;flex:1;background:var(--line)}
.divider span{width:9px;height:9px;border-radius:50%}
.divider span:nth-child(1){background:var(--fresh)}.divider span:nth-child(2){background:var(--soon)}.divider span:nth-child(3){background:var(--warn)}

/* Page head + crumbs */
.page-head{padding-block:clamp(36px,6vw,80px) clamp(28px,4vw,48px);display:grid;gap:var(--s4)}
.crumbs ol{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:8px;font-size:.86rem;color:var(--muted)}
.crumbs li+li::before{content:"/";margin-right:8px;color:var(--line)}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--primary)}
.page-head h1{font-size:clamp(2.8rem,7vw,6rem);line-height:.92;max-width:16ch}

/* Hero */
.hero{padding-block:clamp(32px,6vw,80px) clamp(48px,8vw,104px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(24px,5vw,72px);align-items:center}
.hero-copy{display:grid;gap:var(--s3)}
.wordmark{font-family:var(--f-wordmark);color:var(--primary);font-size:clamp(3.2rem,6.6vw,5.4rem);line-height:.9;margin-bottom:-6px}
.hero h1{font-size:clamp(3.3rem,8.6vw,7.8rem);line-height:.86;letter-spacing:-.012em}
.hero .lede{margin-top:var(--s3);max-width:44ch}
.hero .actions{margin-top:var(--s4)}
.hero-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4);margin-top:var(--s6);padding-top:var(--s4);border-top:1px solid var(--line)}
.hero-meta dt{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.14em;font-size:.76rem;color:var(--primary)}
.hero-meta dd{font-size:.92rem;color:var(--heading);line-height:1.35;margin-top:4px}
.stage-wrap{position:relative;width:100%;max-width:560px;justify-self:end;display:grid;gap:var(--s3)}
.stage{position:relative;aspect-ratio:1/1;width:100%}
.lid{position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--accent) 60%,var(--bg)) 0%,color-mix(in srgb,var(--primary) 20%,var(--bg)) 72%);box-shadow:inset 0 -24px 50px color-mix(in srgb,var(--primary) 22%,transparent),inset 0 0 0 10px color-mix(in srgb,var(--bg) 40%,transparent),var(--sh-2)}
.lid::after{content:"";position:absolute;inset:7%;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--primary) 28%,transparent)}
.hs{position:absolute;filter:drop-shadow(0 10px 14px color-mix(in srgb,var(--ink) 28%,transparent));transition:transform .6s var(--ease)}
.hs svg{display:block;width:100%;height:auto}
.hs1{width:36%;left:5%;top:36%;transform:rotate(-9deg)}
.hs2{width:35%;right:7%;top:9%;transform:rotate(7deg)}
.hs3{width:50%;left:36%;bottom:6%;transform:rotate(-3deg)}
.stage:hover .hs1{transform:rotate(-12deg) translateY(-6px)}
.stage:hover .hs2{transform:rotate(10deg) translateY(-6px)}
.stage:hover .hs3{transform:rotate(-1deg) translateY(-6px)}
.tag{position:absolute;display:inline-flex;align-items:center;gap:7px;background:var(--paper);color:var(--ink);font-family:var(--f-label);font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:var(--r-pill);box-shadow:var(--sh-1);white-space:nowrap}
.tag svg{width:14px;height:14px}
.t1{left:0;top:74%}.t2{right:0;top:46%}.t3{right:2%;bottom:1%}
.figcap{font-size:.82rem;color:var(--muted);text-align:center}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.stage-wrap{justify-self:center}}
@media (max-width:520px){.hero-meta{grid-template-columns:1fr 1fr}.tag{font-size:.7rem;padding:5px 9px}}

/* Sticker */
.sticker{display:block;width:100%;height:auto}
.sticker .ind{transition:transform .5s var(--ease);transform-origin:100px 100px}
.pop .ind{animation:pop .7s var(--ease)}
@keyframes pop{0%{transform:scale(.86);filter:saturate(.3)}60%{transform:scale(1.04)}100%{transform:scale(1);filter:none}}

/* Demo */
.demo{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:clamp(32px,6vw,80px);align-items:center}
.demo-stage{position:relative;aspect-ratio:1;max-width:440px;width:100%;margin-inline:auto;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.demo-stage::before{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid var(--line)}
.demo-stage .sticker{width:70%;filter:drop-shadow(0 16px 20px color-mix(in srgb,var(--ink) 25%,transparent))}
.demo-copy{display:grid;gap:var(--s4);align-content:start}

/* FAQ */
.faq details{border-bottom:1px solid var(--line)}
.faq details:first-child{border-top:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:var(--s4);padding:22px 0;font-family:var(--f-head);font-size:clamp(1.4rem,2.6vw,1.9rem);color:var(--heading);line-height:1.15}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{width:24px;height:24px;flex:none;color:var(--primary);transition:transform var(--t)}
.faq details[open] summary svg{transform:rotate(45deg)}
.faq .ans{padding:0 0 24px;max-width:68ch;display:grid;gap:10px}

/* Accessibility page */
.braille-big{display:flex;flex-wrap:wrap;gap:clamp(10px,2vw,22px);padding:var(--s5);border-radius:var(--r-lg);background:var(--secondary);justify-content:center}
.bcell{display:grid;gap:8px;justify-items:center;color:var(--bg)}
.bcell svg{width:clamp(30px,6vw,52px);height:auto}
.bcell span{font-family:var(--f-label);font-size:1.2rem;letter-spacing:.1em}
.sym-table{width:100%;border-collapse:collapse;font-size:.96rem}
.sym-table th,.sym-table td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.sym-table th{font-family:var(--f-label);font-weight:400;text-transform:uppercase;letter-spacing:.12em;font-size:.85rem;color:var(--primary)}
.table-wrap{overflow-x:auto}
.checklist{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px var(--s5)}
.checklist li{display:flex;gap:10px;align-items:flex-start}
.checklist svg{width:18px;height:18px;color:var(--fresh);flex:none;margin-top:4px;stroke-width:3}
@media (max-width:620px){.checklist{grid-template-columns:1fr}}

/* Business */
.aud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.aud > div{padding:var(--s5) var(--s4) var(--s5) 0;border-bottom:1px solid var(--line);display:grid;gap:6px;align-content:start}
.aud h3{font-size:1.6rem}
@media (max-width:820px){.aud{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.aud{grid-template-columns:1fr}}
.seal-wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center}
.seal-wrap svg{width:100%;height:auto}
@media (max-width:720px){.seal-wrap{grid-template-columns:1fr}.seal-wrap svg{max-width:200px}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.form .full{grid-column:1/-1}
@media (max-width:620px){.form{grid-template-columns:1fr}}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:.92rem;color:var(--heading)}
.field label .req{color:var(--primary)}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:1rem}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 18%,transparent)}
.field [aria-invalid="true"]{border-color:var(--warn)}
.err{color:var(--warn);font-size:.85rem;font-weight:600;min-height:0}
.success{display:grid;gap:var(--s3);padding:var(--s5);border-radius:var(--r-lg);background:color-mix(in srgb,var(--fresh) 10%,var(--bg));border:1px solid color-mix(in srgb,var(--fresh) 45%,transparent)}
.success pre{white-space:pre-wrap;font-size:.85rem;background:var(--paper);color:var(--ink);padding:var(--s4);border-radius:var(--r-sm);margin:0;max-height:220px;overflow:auto}
.form-card{padding:clamp(20px,4vw,40px);border-radius:var(--r-lg);background:var(--surface);display:grid;gap:var(--s5)}

/* About */
.team{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s5)}
@media (max-width:900px){.team{grid-template-columns:1fr 1fr}}
.member{display:grid;gap:var(--s3);align-content:start}
.avatar{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-size:clamp(2.4rem,5vw,3.4rem);color:var(--ink);max-width:100%}
.member h3{font-size:1.55rem}
.member p{font-size:.92rem;color:var(--muted)}
.notyet{list-style:none;padding:0;display:grid;gap:10px}
.notyet li{display:flex;gap:10px;align-items:flex-start}
.notyet svg{width:18px;height:18px;flex:none;margin-top:4px;color:var(--primary)}

/* Theme editor */
.editor{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(24px,4vw,56px);align-items:start}
@media (max-width:980px){.editor{grid-template-columns:1fr}}
.panel{display:grid;gap:var(--s6)}
.panel section{display:grid;gap:var(--s4)}
.panel h2{font-size:clamp(1.9rem,3vw,2.4rem)}
.presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
@media (max-width:720px){.presets{grid-template-columns:1fr 1fr}}
.preset{border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px;background:var(--bg);cursor:pointer;text-align:left;display:grid;gap:10px;color:var(--heading);transition:border-color var(--t),transform var(--t) var(--ease)}
.preset:hover{transform:translateY(-2px);border-color:var(--primary)}
.preset[aria-pressed="true"]{border-color:var(--heading);box-shadow:var(--sh-1)}
.preset .sw{display:flex;height:40px;border-radius:10px;overflow:hidden;border:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.preset .sw span{flex:1}
.preset b{font-family:var(--f-label);font-weight:400;font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase}
.crows{display:grid;gap:4px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 46px 118px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.crow label{font-weight:600;font-size:.94rem;color:var(--heading)}
.crow label small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.crow input[type="color"]{width:46px;height:40px;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--paper);cursor:pointer}
.crow input[type="text"]{width:100%;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-family:ui-monospace,Menlo,monospace;font-size:.9rem;text-transform:uppercase}
.crow input[aria-invalid="true"]{border-color:var(--warn)}
.frows{display:grid;gap:12px}
.frow{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1.1fr);gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.frow label{font-weight:600;font-size:.94rem;color:var(--heading)}
.frow select{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.92rem}
.frow .fp{font-size:1.25rem;color:var(--heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:620px){.frow{grid-template-columns:1fr 1fr}.frow .fp{grid-column:1/-1}}
.savebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;border-radius:var(--r-lg);background:var(--paper);color:var(--ink);box-shadow:var(--sh-2);border:1px solid var(--line)}
.savebar .btn-ghost{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 25%,transparent)}
.savebar .state{font-size:.85rem;margin-left:auto;padding-right:6px;display:inline-flex;align-items:center;gap:6px}
.savebar .state i{width:8px;height:8px;border-radius:50%;background:var(--fresh)}
.savebar .state.dirty i{background:var(--soon)}
.preview{position:sticky;top:96px;display:grid;gap:var(--s3)}
@media (max-width:980px){.preview{position:relative;top:0}}
.pv{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--bg);overflow:hidden;box-shadow:var(--sh-2)}
.pv-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.pv-hdr .logo{font-size:1.8rem}
.pv-hdr nav{display:flex;gap:12px;font-family:var(--f-nav);font-size:.8rem}
.pv-hdr nav span:first-child{color:var(--primary)}
.pv-body{padding:22px 18px;display:grid;gap:14px}
.pv-body h3{font-size:2.3rem;line-height:.95}
.pv-body p{font-size:.92rem}
.pv-card{--c:var(--culture);display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;align-items:center;padding:14px;border-radius:var(--r-md);background:color-mix(in srgb,var(--c) 22%,var(--bg));border:1px solid var(--c)}
.pv-card .cat-name{font-size:1.4rem}
.pv-swatches{display:flex;gap:6px;flex-wrap:wrap}
.pv-swatches span{width:26px;height:26px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 15%,transparent)}
.contrast{display:flex;flex-wrap:wrap;gap:8px;font-size:.82rem}
.contrast span{padding:4px 10px;border-radius:var(--r-pill);background:var(--surface-2);display:inline-flex;gap:6px;align-items:center}
.contrast b{font-variant-numeric:tabular-nums}
.contrast .ok{color:var(--fresh)}.contrast .bad{color:var(--warn)}

/* Footer */
.site-footer{background:var(--secondary);color:color-mix(in srgb,var(--bg) 86%,var(--secondary));margin-top:clamp(48px,8vw,96px)}
.site-footer .wrap{padding-block:clamp(48px,7vw,80px) var(--s6);display:grid;gap:var(--s6)}
.f-top{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:var(--s6)}
.f-top .logo{color:var(--bg);font-size:3.4rem}
.f-top h2{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.16em;font-size:.9rem;color:var(--accent);margin-bottom:12px}
.f-top ul{list-style:none;padding:0;display:grid;gap:8px}
.f-top a{color:var(--bg);text-decoration:none;font-size:.95rem}
.f-top a:hover{text-decoration:underline}
.f-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--s4);padding-top:var(--s5);border-top:1px solid color-mix(in srgb,var(--bg) 22%,transparent);font-size:.85rem}
@media (max-width:860px){.f-top{grid-template-columns:1fr 1fr}.f-top > div:first-child{grid-column:1/-1}}

.to-top{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:0;background:var(--heading);color:var(--bg);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh-2);z-index:40}
.to-top svg{width:20px;height:20px}
.page-enter{animation:enter .55s var(--ease)}
@keyframes enter{from{transform:translateY(10px)}to{transform:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--heading);color:var(--bg);padding:12px 20px;border-radius:var(--r-pill);font-weight:600;font-size:.92rem;z-index:90;box-shadow:var(--sh-2);max-width:calc(100% - 32px)}
.e404{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:var(--s7);align-items:center;padding-block:clamp(48px,8vw,120px)}
@media (max-width:760px){.e404{grid-template-columns:1fr}}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .dg .gas circle{animation:none;opacity:.55}
}
</style>

const BRAILLE=[['A',[1]],['X',[1,3,4,6]],['P',[1,2,3,4]],['I',[2,4]],['R',[1,2,3,5]],['ED',[1,2,4,6]]];
const DOTPOS={1:[0,0],2:[0,1],3:[0,2],4:[1,0],5:[1,1],6:[1,2]};
function brailleDots(x0,y0,pitch,dx,dy,r,raised){
  let s='';
  BRAILLE.forEach(([,dots],i)=>[1,2,3,4,5,6].forEach(d=>{const [c,rw]=DOTPOS[d];const x=x0+i*pitch+c*dx,y=y0+rw*dy;
    if(!dots.includes(d)){s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="none" style="stroke:var(--ink)" stroke-opacity=".28" stroke-width=".8"/>`;return;}
    if(raised) s+=`<circle cx="${(x+.6).toFixed(1)}" cy="${(y+.8).toFixed(1)}" r="${r}" style="fill:var(--ink)" fill-opacity=".3"/>`;
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" style="fill:color-mix(in srgb,var(--ink) 72%,var(--paper))" fill-opacity="${raised?1:.55}"/>`;
    if(raised) s+=`<circle cx="${(x-r*.35).toFixed(1)}" cy="${(y-r*.35).toFixed(1)}" r="${(r*.32).toFixed(1)}" style="fill:var(--white)" fill-opacity=".75"/>`;}));
  return s;
}

/* ---------- FAQ ---------- */
const FAQ=[
 ['What is TellTale?','TellTale is a product concept from Verita: a pack of colour-changing stickers designed to indicate possible food spoilage. Each sticker would move from green to yellow to red as gases associated with food deterioration build up. It is a concept in development, not a product on sale.'],
 ['How does the proposed sticker work?','The proposed design lets target compounds released by deteriorating food reach an indicator layer, which is intended to change colour as their levels rise. A hydrogel-based layer is proposed to reveal a raised Braille warning at the red stage. See How It Works for the full sequence.'],
 ['Does the sticker touch my food?','No. The intended design places stickers on suitable container surfaces such as lids and caps, not inside the container or on the food. How gases reach the indicator, which materials are safe, and where the sticker should go all need to be validated before any commercial use.'],
 ['Can it guarantee food is safe?','No. Many harmful bacteria do not produce noticeable gases, so no gas indicator can confirm that food is safe. TellTale is meant to add one more signal alongside use-by dates, storage instructions and food-safety guidance.'],
 ['What does green mean?','Green is a fresh-stage indication: the indicator has not detected its target compounds above the proposed threshold. It is not a guarantee of safety.'],
 ['What does yellow mean?','Yellow is a prompt to check. Look at the use-by date, the storage instructions and the food itself. Yellow does not tell you how many days are left.'],
 ['What does red mean?','Red is a spoilage warning. Do not eat the food based on the sticker alone. Follow food-safety guidance; when in doubt, throw it out.'],
 ['How do blind users identify the warning?','The concept includes a raised tactile marker so the sticker can be found by touch, and a Braille warning reading EXPIRED (⠁⠭⠏⠊⠗⠫) that is intended to become perceptible at the red stage. This must be prototyped and tested with Braille readers.'],
 ['What makes the concept different from conventional expiry labels?','A printed date is set at the factory and assumes ideal storage. TellTale is designed to respond to conditions inside your container, and to communicate through colour and touch. It would work alongside dates, not replace them.'],
 ['Does every food require the same indicator?','No. Different foods release different compounds as they deteriorate, so the concept proposes five categories, each with its own sensing chemistry.'],
 ['Has the technology been scientifically validated?','Not yet. The detection chemistry, response times, tactile mechanism, material safety and accuracy all still need laboratory testing and user testing.'],
 ['Can I use it instead of checking the use-by date?','No. Always follow use-by dates, storage instructions and food-safety guidance. TellTale is designed to supplement them.'],
 ['Is the sticker reusable?','The current concept is single-use, because the indicator reaction is designed to be one-way. Reusable or recyclable versions are something we would like to explore.'],
 ['When will the product be available?','There is no release date. TellTale is at the concept and prototyping stage. Businesses interested in a future pilot can register interest on the For Businesses page.']

function renderAbout(){
  return pageHead('About','About Verita','We started with a simple question: is this still good?','Verita means truth. Our aim is to help food communicate its condition more honestly, to everyone.')+`
<section class="section tight" style="padding-top:0"><div class="wrap split" style="align-items:start">
 <div class="prose"><p class="eyebrow">The problem we want to solve</p><h2 class="h2">Guesswork at the fridge door.</h2>
 <p>People often rely on appearance, smell or guesswork when judging food. That creates uncertainty, leads to good food being thrown away, and makes food-safety decisions harder than they should be. For people who are blind, have low vision or are colour-blind, the usual cues are even less reliable.</p></div>
 <div class="prose"><p class="eyebrow">Our mission</p><h2 class="h2">Make food condition easier to understand.</h2>
 <p>To explore more accessible, intuitive ways of communicating food condition, and to encourage informed decisions about using food, so that less of it is wasted and fewer people have to guess.</p></div>
</div></section>
<section class="section band"><div class="wrap split" style="align-items:start">
 <div style="display:grid;gap:var(--s4)"><p class="eyebrow">Why accessibility matters</p><h2 class="h2">If it only works for some people, it doesn’t work.</h2></div>
 <p class="muted lede">A freshness cue that depends on seeing small print or telling red from green leaves people out. That is why the Colour Guide explains each stage in words, and why the tactile Braille warning is central to the concept rather than an extra.</p>
</div></section>
<section class="section tight"><div class="wrap">
 <div class="section-head"><div><p class="eyebrow">Our approach to innovation</p><h2 class="h2">Honest about what we know, and what we don’t.</h2></div>
 <p class="lede">We separate what TellTale is intended to do, what the design could achieve, and what still needs testing.</p></div>
 <div class="steps4">
  <div><span class="num">01</span><h3>Design</h3><p>Shape the concept around real kitchens and real users.</p></div>
  <div><span class="num">02</span><h3>Prototype</h3><p>Build sticker samples and tactile layers we can hold and test.</p></div>
  <div><span class="num">03</span><h3>Validate</h3><p>Test chemistry, safety and accuracy in the lab, and the tactile warning with Braille readers.</p></div>
  <div><span class="num">04</span><h3>Improve</h3><p>Change the design based on evidence before making any claims.</p></div>
 </div>
</div></section>
<section class="section tight"><div class="wrap split" style="align-items:start">
 <div style="display:grid;gap:var(--s4)"><p class="eyebrow">Where we are today</p><h2 class="h3" style="font-size:2rem">What we have not done yet</h2></div>
 <ul class="notyet">${['Laboratory testing of the sensing chemistry','Material-safety testing for food-container use','User testing of the tactile warning with Braille readers','Manufacturing partnerships, certifications or awards'].map(t=>`<li>${icon('dot')}<span>${t}</span></li>`).join('')}</ul>
</div></section>
<section class="section tight"><div class="wrap">
 <div class="section-head"><div><p class="eyebrow">The team</p><h2 class="h2">The people behind Verita.</h2></div><p class="lede">Four students who believe food should tell the truth.</p></div>
 <div class="team">${TEAM.map(m=>`<div class="member"><div class="avatar" style="background:${m.c}" aria-hidden="true">${m.n.split(' ').map(p=>p[0]).join('')}</div><h3>${m.n}</h3><p>${m.r}</p></div>`).join('')}</div>
</div></section>`;
}

/* ---------- Make It Yours ---------- */
function lum(hex){const n=parseInt(hex.slice(1),16);return [n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)}
const ratio=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function renderEditor(){
  return pageHead('Make It Yours','Design studio','Make it yours.','Change the colours and fonts of the entire Verita website. Changes apply instantly; save them to keep them on this device.')+`
<section class="section tight" style="padding-top:0"><div class="wrap editor">
 <div class="panel">
  <section aria-labelledby="ed-p"><h2 id="ed-p">Presets</h2><div class="presets" id="ed-presets">${Object.entries(PRESETS).map(([k,p])=>`<button type="button" class="preset" data-preset="${k}" aria-pressed="${theme.preset===k}"><span class="sw" aria-hidden="true">${(k==='pastel'?Object.values(CAT_DEFAULTS):[p.colors.bg,p.colors.primary,p.colors.secondary,p.colors.accent,p.colors.heading]).map(c=>`<span style="background:${c}"></span>`).join('')}</span><b>${p.name}</b></button>`).join('')}</div></section>
  <section aria-labelledby="ed-c"><div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap"><h2 id="ed-c">Colours</h2><button class="btn-link" type="button" id="ed-reset-colors">Restore brand colours</button></div>
   <div class="crows">${COLOR_FIELDS.map(([k,l,h])=>colorRow('c',k,l,h,theme.colors[k])).join('')}</div>
   <div class="contrast" id="ed-contrast"></div></section>
  <section aria-labelledby="ed-cat"><div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap"><h2 id="ed-cat">Category colours</h2><button class="btn-link" type="button" id="ed-reset-cats">Restore the five original colours</button></div>
   <div class="crows">${CATS.map(c=>colorRow('k',c.id,c.name,c.sub,theme.cats[c.id])).join('')}</div></section>
  <section aria-labelledby="ed-f"><div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap"><h2 id="ed-f">Typography</h2><button class="btn-link" type="button" id="ed-reset-fonts">Restore brand typography</button></div>
   <div class="frows">${FONT_FIELDS.map(([k,l])=>`<div class="frow"><label for="fs-${k}">${l}</label><select id="fs-${k}" data-font="${k}">${Object.entries(FONTS).filter(([fk,f])=>k==='wordmark'||k==='head'||!f.script).map(([fk,f])=>`<option value="${fk}" ${theme.fonts[k]===fk?'selected':''}>${f.name}</option>`).join('')}</select><span class="fp" id="fp-${k}" style="font-family:${FONTS[theme.fonts[k]].stack}">${k==='wordmark'?'Verita':'Know before you eat'}</span></div>`).join('')}</div>
   <p class="small muted">Burgues Script and Times New Roman MT Condensed are not freely licensed for the web, so the brand uses close open-licence alternatives (Pinyon Script and Instrument Serif) unless the original fonts are installed on your device.</p></section>
  <div class="savebar"><button class="btn btn-primary btn-sm" type="button" id="ed-save">Save theme</button><button class="btn btn-ghost btn-sm" type="button" id="ed-revert">Restore saved</button><button class="btn btn-ghost btn-sm" type="button" id="ed-reset">Reset all</button><button class="btn btn-ghost btn-sm" type="button" id="ed-css">${icon('copy')} Copy CSS</button><span class="state" id="ed-state" aria-live="polite"><i></i><span></span></span></div>
 </div>
 <aside class="preview" aria-label="Live preview">
  <p class="eyebrow">Live preview</p>
  <div class="pv">
   <div class="pv-hdr"><img src="${LOGO}" alt="" width="40" height="40" style="border-radius:8px"><nav aria-hidden="true"><span>Home</span><span>Categories</span><span>Recipes</span></nav></div>
   <div class="pv-body">
    <h3>Food that tells the <em class="rose">truth.</em></h3>
    <p>Meet TellTale, the sticker concept designed to help you recognise signs of food spoilage.</p>
    <div class="pv-card"><div style="display:grid;gap:6px"><span class="badge" style="--c:var(--culture);width:max-content"><i></i>Culture</span><span class="cat-name">Curd &amp; yogurt</span><span class="small" style="color:var(--ink)">Fresh-stage indication</span></div>${sticker('fresh','var(--culture)','var(--ink)','Preview sticker')}</div>
    <div class="actions"><span class="btn btn-primary btn-sm">Discover TellTale</span><span class="btn btn-ghost btn-sm">Explore the science</span></div>
    <div class="pv-swatches" aria-hidden="true">${['pantry','culture','sip','harvest','proteins'].map(c=>`<span style="background:var(--${c})"></span>`).join('')}<span style="background:var(--secondary)"></span><span style="background:var(--accent)"></span></div>
   </div>
  </div>
  <p class="small muted">The whole site updates as you edit. Saved themes live in this browser only.</p>
 </aside>
</div></section>`;
}
function colorRow(p,k,l,h,v){return `<div class="crow"><label for="${p}t-${k}">${l}${h?`<small>${h}</small>`:''}</label><input type="color" id="${p}p-${k}" value="${v}" data-${p==='c'?'color':'cat'}="${k}" aria-label="${l} colour picker"><input type="text" id="${p}t-${k}" value="${v}" maxlength="7" spellcheck="false" data-${p==='c'?'color':'cat'}="${k}" inputmode="text"></div>`}
function syncEditor(){
  for(const k in theme.colors){const p=$('#cp-'+k),t=$('#ct-'+k);if(p){p.value=theme.colors[k];t.value=theme.colors[k].toUpperCase();t.setAttribute('aria-invalid','false')}}
  for(const k in theme.cats){const p=$('#kp-'+k),t=$('#kt-'+k);if(p){p.value=theme.cats[k];t.value=theme.cats[k].toUpperCase();t.setAttribute('aria-invalid','false')}}
  for(const k in theme.fonts){const s=$('#fs-'+k);if(s){s.value=theme.fonts[k];$('#fp-'+k).style.fontFamily=FONTS[theme.fonts[k]].stack}}
  $$('#ed-presets .preset').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.preset===theme.preset)));
  const c=theme.colors, pairs=[['Body text',c.text,c.bg],['Headings',c.heading,c.bg],['Buttons',c['btn-text'],c.btn],['Brand on background',c.primary,c.bg]];
  $('#ed-contrast').innerHTML=pairs.map(([n,a,b])=>{const r=ratio(a,b);const ok=r>=4.5;return `<span>${n}: <b>${r.toFixed(1)}:1</b> <em class="${ok?'ok':'bad'}" style="font-style:normal">${ok?'Passes AA':r>=3?'Large text only':'Low contrast'}</em></span>`}).join('');
  const dirty=!saved?!same(theme,defaultTheme()):!same(theme,saved);
  const st=$('#ed-state');st.classList.toggle('dirty',dirty);$('span',st).textContent=dirty?'Unsaved changes':saved?'Saved':'Brand defaults';
}
function changed(){theme.preset=Object.keys(PRESETS).find(k=>same(PRESETS[k].colors,theme.colors)&&same(PRESETS[k].fonts,theme.fonts))||'';applyTheme();syncEditor();}
function initEditor(){
  syncEditor();
  const root=$('.editor');
  root.addEventListener('input',e=>{
    const el=e.target, k=el.dataset.color||el.dataset.cat; if(!k) return;
    const bag=el.dataset.color?theme.colors:theme.cats;
    let v=el.value.trim(); if(el.type==='text'&&v&&v[0]!=='#') v='#'+v;
    if(!HEX.test(v)){el.setAttribute('aria-invalid','true');return;}
    el.setAttribute('aria-invalid','false'); bag[k]=v.toLowerCase(); changed();
  });
  root.addEventListener('change',e=>{const k=e.target.dataset.font;if(!k)return;theme.fonts[k]=e.target.value;changed();});
  $('#ed-presets').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(!b)return;const p=PRESETS[b.dataset.preset];theme.colors=clone(p.colors);theme.fonts=clone(p.fonts);theme.cats=clone(CAT_DEFAULTS);theme.preset=b.dataset.preset;applyTheme();syncEditor();announce(p.name+' preset applied');});
  $('#ed-reset-colors').onclick=()=>{theme.colors=clone(PRESETS.original.colors);changed();announce('Brand colours restored');};
  $('#ed-reset-cats').onclick=()=>{theme.cats=clone(CAT_DEFAULTS);changed();announce('Original category colours restored');};
  $('#ed-reset-fonts').onclick=()=>{theme.fonts=clone(BRAND_FONTS);changed();announce('Brand typography restored');};
  $('#ed-save').onclick=()=>{try{localStorage.setItem(KEY,JSON.stringify(theme));saved=clone(theme);syncEditor();toast('Theme saved on this device');}catch(err){toast('Could not save: this browser is blocking storage');}};
  $('#ed-revert').onclick=()=>{if(!saved){toast('No saved theme yet');return;}theme=clone(saved);applyTheme();syncEditor();toast('Saved theme restored');};
  $('#ed-reset').onclick=()=>{theme=defaultTheme();try{localStorage.removeItem(KEY)}catch(err){}saved=null;applyTheme();syncEditor();toast('Reset to Verita brand defaults');};
  $('#ed-css').onclick=()=>{const css=':root{\n'+Object.entries(theme.colors).map(([k,v])=>`  --${k}:${v};`).join('\n')+'\n'+Object.entries(theme.cats).map(([k,v])=>`  --${k}:${v};`).join('\n')+'\n'+Object.entries(theme.fonts).map(([k,v])=>`  --f-${k}:${FONTS[v].stack};`).join('\n')+'\n}';copyText(css,null);};
}

function render404(){
  return `<section class="wrap e404"><div style="display:grid;gap:var(--s4)">${crumbs('Page not found')}<p class="eyebrow">Error 404</p><h1 class="display">This page has gone off.</h1><p class="lede">We couldn’t find that page. It may have moved, or the link may be mistyped.</p><div class="actions"><a class="btn btn-primary" href="#home">Back to home</a><a class="btn btn-ghost" href="#faq">Read the FAQ</a></div></div><div>${sticker('warn','var(--primary)','var(--paper)','Red sticker illustration')}</div></section>`;
}

/* ---------- Router ---------- */
const PAGES={
 home:[renderHome,initHome,'Verita · Food that tells the truth','TellTale by Verita is a colour-changing food-safety sticker concept designed to help people recognise signs of food spoilage.'],
 'how-it-works':[renderHow,initHow,'How It Works · Verita TellTale','How the proposed TellTale sticker is designed to respond to gases from food deterioration.'],
 categories:[renderCategories,null,'Categories · Verita TellTale','The five TellTale categories: Pantry, Culture, Sip, Harvest and Proteins.'],
 'colour-guide':[renderGuide,initGuide,'Colour Guide · Verita TellTale','What green, yellow and red mean on a TellTale sticker, by food category.'],
 recipes:[renderRecipes,initRecipes,'Use It Up Recipes · Verita TellTale','Recipes for food that is still good but needs using soon.'],
 storage:[renderStorage,initStorage,'Storage Guide · Verita TellTale','Practical food-storage guidance for Indian households.'],
 accessibility:[renderA11y,null,'Accessibility · Verita TellTale','How TellTale is designed for blind, low-vision and colour-blind users.'],
 business:[renderBiz,initBiz,'For Businesses · Verita TellTale','Pilot programmes and enquiries for restaurants, cafés, retailers and food brands.'],
 faq:[renderFaq,null,'Safety & FAQ · Verita TellTale','Honest answers about the TellTale food-safety sticker concept.'],
 about:[renderAbout,null,'About · Verita','The story, mission and team behind Verita.'],
 'make-it-yours':[renderEditor,initEditor,'Make It Yours · Verita','Customise the Verita website’s colours and fonts.']
};
let current='home';
function readHash(){try{return decodeURIComponent(location.hash.slice(1))}catch(e){return ''}}
// Navigate without relying on the browser following the link: render the page directly, then try to record it in the address bar.
function go(name){
  if(!name||name==='top') name='home';
  route(name);
  try{ if(readHash()!==name) history.pushState(null,'','#'+name); }catch(e){}
}
function route(forced){
  const h=(typeof forced==='string'?forced:readHash())||'home';
  current=h;
  const p=PAGES[h], main=$('#main');
  if($('#modal').open) $('#modal').close();
  setMenu(false);
  main.innerHTML=p?p[0]():render404();
  main.classList.remove('page-enter');void main.offsetWidth;main.classList.add('page-enter');
  if(p&&p[1]) p[1]();
  document.title=p?p[2]:'Page not found · Verita';
  const md=$('meta[name="description"]'); if(md&&p) md.content=p[3];
  const og=$('meta[property="og:title"]'); if(og) og.content=document.title;
  $$('[data-nav]').forEach(a=>{if(a.dataset.nav===h)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  window.scrollTo({top:0,behavior:'instant'});
  if(routed){const t=$('h1',main);if(t){t.setAttribute('tabindex','-1');t.focus({preventScroll:true});}}
  routed=true;
}
let routed=false;
window.addEventListener('hashchange',()=>{const h=readHash()||'home';if(h!==current)route(h);});
window.addEventListener('popstate',()=>{const h=readHash()||'home';if(h!==current)route(h);});

/* ---------- Modal ---------- */
let lastFocus=null;
function openModal(html){
  const m=$('#modal'); lastFocus=document.activeElement;
  m.innerHTML=`<button class="m-close" type="button" data-close aria-label="Close">${icon('close')}</button>`+html;
  m.showModal(); $('.m-close',m).focus();
}
$('#modal').addEventListener('close',()=>{if(lastFocus&&document.contains(lastFocus))lastFocus.focus()});
$('#modal').addEventListener('click',e=>{if(e.target===e.currentTarget||e.target.closest('[data-close]'))$('#modal').close()});

/* ---------- Global clicks ---------- */
document.addEventListener('click',e=>{
  const sk=e.target.closest('[data-skip]'); if(sk){e.preventDefault();const t=$('#main h1')||$('#main');t.setAttribute('tabindex','-1');t.focus();return;}
  const sc=e.target.closest('[data-scroll]'); if(sc){e.preventDefault();const t=document.getElementById(sc.dataset.scroll);if(t){t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});const h=$('h2',t);if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}}return;}
  const co=e.target.closest('[data-cat-open]'); if(co){openCat(co.dataset.catOpen);return;}
  const rc=e.target.closest('[data-recipe]'); if(rc){openRecipe(rc.dataset.recipe);return;}
  const gd=e.target.closest('[data-guide]'); if(gd){guideCat=gd.dataset.guide;guideStage='fresh';$('#modal').close();go('colour-guide');return;}
  const lk=e.target.closest('a[href^="#"]');
  if(lk&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey&&e.button===0){const name=lk.getAttribute('href').slice(1);if(PAGES[name]||name==='home'||name===''){e.preventDefault();setMenu(false);go(name||'home');return;}}
});

/* ---------- Back to top ---------- */
const tt=$('#to-top');
window.addEventListener('scroll',()=>{tt.hidden=window.scrollY<700},{passive:true});
tt.addEventListener('click',()=>{window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});$('.logo').focus();});

route();
})();
</script>
